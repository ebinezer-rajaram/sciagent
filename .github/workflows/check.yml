# Check-only CI: the type checker and the suite, and nothing else.
#
# Why this exists (docs/BACKLOG.md, gate A38): every verification claim in this
# repository was session-local. `.claude/hooks/suite-freshness.sh` exists because
# a suite that ran 18:00-18:07 on 2026-08-15 was certified green against a tree a
# second session had changed at 18:05:56, and that had to be caught by hand.
#
# Why a Linux runner does not conflict with the Windows pin: the pin governs
# produced *numbers* -- registry entries, cached tables, reported figures -- and
# not verification. This job produces none of them and, deliberately, carries
# nothing off the runner. There is **no `actions/cache` step**: the empirical
# tables are written under the checkout's `.cache/`, and caching that would
# persist Ubuntu-built rows into every later job, which is exactly the
# cross-platform comparison the pin closes. Table acquisition costs about three
# minutes cold, and paying it every run is the price of that guarantee.
# `tests/acceptance/test_a38.py` enforces this rather than trusting the comment.
#
# `-n 4 --dist loadfile` is CLAUDE.md's measured invocation, not a taste. `-n 4`
# is what `-n auto` resolves to on GitHub's 4-vCPU runners, and `--dist loadfile`
# is load-bearing: without it a module's tests split across workers and each
# re-simulates table rows its siblings already built, which is slower than
# serial. One measured test goes from 0.00s to 118.14s under the default `load`.

name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Type check
        run: uv run mypy

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -n 4 --dist loadfile
