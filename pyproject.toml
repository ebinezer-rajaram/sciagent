[project]
name = "sciagent"
version = "0.1.0"
description = "Constrained agentic scientific investigation under model misspecification"
readme = "README.md"
authors = [
    { name = "Ebinezer Rajaram", email = "ebinezer.rajaram04@gmail.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=0.120.2",
    "clarabel>=0.11.1",
    "claude-agent-sdk>=0.2.139,<0.2.140",
    "cvxpy>=1.9.3",
    "mcp>=1.29,<2",
    "numpy>=2.1",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest-xdist>=3.8.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sciagent", "src/environments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: simulation-heavy or subprocess tests (> ~2 s); run with -m slow before merging src/ changes",
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/sciagent", "src/environments", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
src = ["src"]
# docs/SPEC.md is frozen. Ruff reformats the Python blocks inside it, so
# `ruff format .` would silently edit a document that must not change.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
