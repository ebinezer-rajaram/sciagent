# Check-only CI: types, lint, format and the full suite (both tiers).
#
# Linux CI does not conflict with Windows being the reference platform: that pin
# governs produced numbers, and this job produces none and carries nothing off the
# runner. That is why there is no `actions/cache` step for `.cache/`, and
# tests/acceptance/test_repository.py enforces it.
#
# The whole suite ran in ~30 s locally after the v2 cleanup (2026-10-01), so 10
# minutes is generous headroom. README-only pushes skip the job.

name: check

on:
  push:
    paths-ignore:
      - "README.md"
  pull_request:
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Type check
        run: uv run mypy

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -n 4 --dist loadfile
